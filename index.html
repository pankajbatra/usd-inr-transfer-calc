<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toptal transfer calculator — Skydo vs bank wire</title>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f4f3ef;
    --surface-0: #ebeae4;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a64;
    --border: #ddd9d0;
    --border-strong: #c7c2b6;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--surface-0);
    color: var(--text-primary);
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface-2);
    border-radius: 16px;
    padding: 2rem;
    border: 0.5px solid var(--border);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 1.5rem;
  }
  label {
    font-size: 13px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }
  input[type="number"] {
    width: 100%;
    height: 36px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    padding: 0 10px;
    font-size: 14px;
    background: var(--surface-2);
    color: var(--text-primary);
  }
  input[type="number"]:focus {
    outline: none;
    border-color: #5b8def;
    box-shadow: 0 0 0 2px rgba(91,141,239,0.25);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--surface-1);
    border-radius: 12px;
    padding: 1rem;
  }
  .card p:first-child {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }
  .card p:last-child {
    font-size: 24px;
    font-weight: 600;
    margin: 0;
  }
  #winner {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 1.5rem;
  }
  .section {
    border-top: 0.5px solid var(--border);
    padding-top: 1rem;
    margin-bottom: 1rem;
  }
  .section p.heading {
    font-weight: 600;
    font-size: 14px;
    margin: 0 0 8px;
  }
  table {
    width: 100%;
    font-size: 13px;
    border-collapse: collapse;
  }
  td {
    padding: 4px 0;
  }
  td:last-child {
    text-align: right;
  }
  td.label {
    color: var(--text-secondary);
  }
  td.bold {
    font-weight: 600;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1.5rem;
  }
  footer a { color: inherit; }
  .bank-config {
    background: var(--surface-1);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 12px;
  }
  .bank-config .grid-3 {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  .bank-config label { margin-bottom: 4px; }
  .remove-btn {
    height: 36px;
    padding: 0 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
  }
  .remove-btn:hover { color: #c0392b; border-color: #c0392b; }
  #add-bank-btn {
    width: 100%;
    height: 36px;
    border-radius: var(--radius);
    border: 1px dashed var(--border-strong);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 1.5rem;
  }
  #add-bank-btn:hover { border-color: #5b8def; color: #5b8def; }
  .totals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Toptal transfer calculator</h1>
  <p class="subtitle">Compare INR credit: Skydo vs bank wire transfer</p>

  <div class="grid-2">
    <div>
      <label for="rate">Interbank rate (INR/USD)</label>
      <input type="number" id="rate" value="83.50" step="0.01">
      <p id="rate-status" style="font-size:11px;color:var(--text-secondary);margin:4px 0 0;"></p>
    </div>
    <div>
      <label for="amount">Toptal transfer amount (USD)</label>
      <input type="number" id="amount" value="5000" step="1">
    </div>
  </div>

  <div class="totals-grid" id="totals-grid"></div>

  <div id="winner"></div>

  <div class="section">
    <p class="heading">Skydo breakdown</p>
    <table id="skydo-table"></table>
  </div>

  <div class="section">
    <p class="heading">Bank wire transfers</p>
    <div id="bank-configs"></div>
    <button id="add-bank-btn" type="button">+ Add bank</button>
    <div id="bank-breakdowns"></div>
  </div>

  <footer>Rates and fee slabs as of Jul 2026 — verify against current bank/Skydo rate cards before relying on this.</footer>
</div>

<script>
function row(label, value, bold) {
  return '<tr><td class="label">' + label + '</td><td' + (bold ? ' class="bold"' : '') + '>' + value + '</td></tr>';
}
function fmt(n) { return n.toLocaleString('en-IN', {maximumFractionDigits: 2}); }

function cctINR(grossINR) {
  if (grossINR <= 100000) {
    return Math.max(grossINR * 0.01, 250) * 0.18;
  } else if (grossINR <= 1000000) {
    var taxable = 1000 + (grossINR - 100000) * 0.005;
    return taxable * 0.18;
  } else {
    var taxable2 = 5500 + (grossINR - 1000000) * 0.001;
    var gst = taxable2 * 0.18;
    return Math.min(gst, 10800);
  }
}

var toptalWireFee = 10;
var bankIdSeq = 0;
var banks = [
  { id: bankIdSeq++, name: 'ICICI', swiftFee: 0, markupPaise: 8, intermediaryFeeUSD: 0 }
];

function renderBankConfigs() {
  var container = document.getElementById('bank-configs');
  container.innerHTML = banks.map(function(b) {
    return '<div class="bank-config" data-id="' + b.id + '">' +
      '<div class="grid-3">' +
        '<div><label>Bank name</label><input type="text" class="bank-name" value="' + b.name + '"></div>' +
        '<div><label>Inward remittance / SWIFT fee (\u20b9)</label><input type="number" class="bank-swift" value="' + b.swiftFee + '" step="1"></div>' +
        '<div><label>Intermediary bank charge ($)</label><input type="number" class="bank-intermediary" value="' + b.intermediaryFeeUSD + '" step="1"></div>' +
        '<div><label>Bank markup (paise)</label><input type="number" class="bank-markup" value="' + b.markupPaise + '" step="1"></div>' +
        '<button type="button" class="remove-btn">Remove</button>' +
      '</div>' +
    '</div>';
  }).join('');

  container.querySelectorAll('.bank-config').forEach(function(el) {
    var id = parseInt(el.getAttribute('data-id'), 10);
    var bank = banks.find(function(b) { return b.id === id; });
    el.querySelector('.bank-name').addEventListener('input', function(e) {
      bank.name = e.target.value;
      calc();
    });
    el.querySelector('.bank-swift').addEventListener('input', function(e) {
      bank.swiftFee = parseFloat(e.target.value) || 0;
      calc();
    });
    el.querySelector('.bank-markup').addEventListener('input', function(e) {
      bank.markupPaise = parseFloat(e.target.value) || 0;
      calc();
    });
    el.querySelector('.bank-intermediary').addEventListener('input', function(e) {
      bank.intermediaryFeeUSD = parseFloat(e.target.value) || 0;
      calc();
    });
    el.querySelector('.remove-btn').addEventListener('click', function() {
      banks = banks.filter(function(b) { return b.id !== id; });
      renderBankConfigs();
      calc();
    });
  });
}

function calc() {
  var rate = parseFloat(document.getElementById('rate').value) || 0;
  var amount = parseFloat(document.getElementById('amount').value) || 0;

  var toptalFee = 0.5;
  var netUSD = amount - toptalFee;

  var skydoFeeUSD;
  if (netUSD <= 2000) skydoFeeUSD = 19;
  else if (netUSD <= 10000) skydoFeeUSD = 29;
  else skydoFeeUSD = netUSD * 0.003;
  var skydoGST = skydoFeeUSD * 0.18;
  var skydoUSDAfterFees = netUSD - skydoFeeUSD - skydoGST;
  var skydoINR = skydoUSDAfterFees * rate;

  document.getElementById('skydo-table').innerHTML =
    row('Toptal amount', '$' + fmt(amount)) +
    row('Toptal US transfer fee', '-$' + fmt(toptalFee)) +
    row('Net USD received', '$' + fmt(netUSD)) +
    row('Skydo fee', '-$' + fmt(skydoFeeUSD)) +
    row('GST on fee (18%)', '-$' + fmt(skydoGST)) +
    row('USD converted', '$' + fmt(skydoUSDAfterFees)) +
    row('Conversion rate', '\u20b9' + fmt(rate) + '/USD') +
    row('INR credited', '\u20b9' + fmt(skydoINR), true);

  var netUSD2 = amount - toptalWireFee;
  var results = [{ name: 'Skydo', total: skydoINR }];

  var breakdownsHTML = '';
  banks.forEach(function(b) {
    var netUSD3 = netUSD2 - b.intermediaryFeeUSD;
    var bankRate = rate - b.markupPaise / 100;
    var grossINR = netUSD3 * bankRate;
    var swiftFeeGST = b.swiftFee * 0.18;
    var swiftFeeTotal = b.swiftFee + swiftFeeGST;
    var cct = cctINR(grossINR);
    var bankINR = grossINR - swiftFeeTotal - cct;

    results.push({ name: b.name || 'Bank', total: bankINR });

    breakdownsHTML +=
      '<div class="section"><p class="heading">' + (b.name || 'Bank') + ' breakdown</p><table>' +
      row('Toptal amount', '$' + fmt(amount)) +
      row('Toptal wire transfer fee', '-$' + fmt(toptalWireFee)) +
      row('Intermediary bank charge', '-$' + fmt(b.intermediaryFeeUSD)) +
      row('Net USD received', '$' + fmt(netUSD3)) +
      row((b.name || 'Bank') + ' rate (interbank - ' + fmt(b.markupPaise) + 'p)', '\u20b9' + fmt(bankRate) + '/USD') +
      row('Gross INR (before charges)', '\u20b9' + fmt(grossINR)) +
      row('SWIFT / inward remittance fee', '-\u20b9' + fmt(b.swiftFee)) +
      row('GST on SWIFT fee (18%)', '-\u20b9' + fmt(swiftFeeGST)) +
      row('CCT/GST on conversion', '-\u20b9' + fmt(cct)) +
      row('INR credited', '\u20b9' + fmt(bankINR), true) +
      '</table></div>';
  });
  document.getElementById('bank-breakdowns').innerHTML = breakdownsHTML;

  document.getElementById('totals-grid').innerHTML = results.map(function(r) {
    return '<div class="card"><p>' + r.name + ' net credit</p><p>\u20b9' + fmt(r.total) + '</p></div>';
  }).join('');

  var winnerEl = document.getElementById('winner');
  var best = results.reduce(function(a, b) { return b.total > a.total ? b : a; });
  var rest = results.filter(function(r) { return r !== best; });
  var closest = rest.reduce(function(a, b) { return (a === null || b.total > a.total) ? b : a; }, null);
  if (!closest || Math.abs(best.total - closest.total) < 1) {
    winnerEl.textContent = 'All options credit roughly the same amount.';
  } else {
    winnerEl.textContent = best.name + ' credits \u20b9' + fmt(best.total - closest.total) + ' more than ' + closest.name + '.';
  }
}

document.getElementById('rate').addEventListener('input', calc);
document.getElementById('amount').addEventListener('input', calc);
document.getElementById('add-bank-btn').addEventListener('click', function() {
  banks.push({ id: bankIdSeq++, name: '', swiftFee: 0, markupPaise: 0, intermediaryFeeUSD: 0 });
  renderBankConfigs();
  calc();
});

renderBankConfigs();
calc();

fetch('https://open.er-api.com/v6/latest/USD')
  .then(function(res) { return res.json(); })
  .then(function(data) {
    var rate = data && data.rates && data.rates.INR;
    if (rate) {
      document.getElementById('rate').value = rate.toFixed(2);
      var ist = new Date((data.time_last_update_unix + 19800) * 1000);
      var istStr = ist.toLocaleString('en-IN', {
        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC'
      });
      document.getElementById('rate-status').textContent = 'Live rate as of ' + istStr + ' IST';
      calc();
    }
  })
  .catch(function() {
    document.getElementById('rate-status').textContent = 'Could not fetch live rate — using default.';
  });
</script>
</body>
</html>
